name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # v5, not v6: v6 bundles a proprietary caching component under separate terms of use.
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew --no-daemon build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests

  # V2 (LLD §18): the Go simulator and the React web app.
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: spike
          POSTGRES_USER: spike
          POSTGRES_PASSWORD: spike
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spike -d spike"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      kafka:
        image: apache/kafka:4.3.1
        env:
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
          KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
          KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
        ports:
          - 29092:29092
        options: >-
          --memory 1g
          --label com.ridehailing.spike=s4
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: simulator/go.mod
          cache-dependency-path: |
            simulator/go.sum
            spikes/bench/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: Verify Kafka delivery and PostgreSQL fencing for spike S-4
        working-directory: spikes/bench
        env:
          SPIKE_TEST_PG: postgres://spike:spike@localhost:5432/spike?sslmode=disable
          SPIKE_TEST_KAFKA: localhost:29092
          SPIKE_TEST_KAFKA_CONTAINER: ${{ job.services.kafka.id }}
        run: |
          go vet ./...
          go test -count=1 -race ./...

  replicated-kafka:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: spikes/bench/go.mod
          cache-dependency-path: spikes/bench/go.sum
      - name: Start the isolated three-broker cluster
        run: docker compose -p ride-s4-replicated -f spikes/compose.yaml --profile s4-replicated up --detach --wait --wait-timeout 150 kafka-r1 kafka-r2 kafka-r3
      - name: Verify acknowledged data and writes after leader loss
        working-directory: spikes/bench
        env:
          SPIKE_TEST_KAFKA_REPLICATED_BROKERS: localhost:39092,localhost:39093,localhost:39094
        run: |
          export SPIKE_TEST_KAFKA_REPLICATED_CONTAINERS="$(docker compose -p ride-s4-replicated -f ../compose.yaml --profile s4-replicated ps -q kafka-r1 kafka-r2 kafka-r3)"
          go vet -tags replicated ./...
          go test -tags replicated -count=1 -race -v -run '^TestKafkaOutboxSurvivesReplicatedLeaderLoss$' ./...
      - name: Show replicated broker logs on failure
        if: failure()
        run: docker compose -p ride-s4-replicated -f spikes/compose.yaml --profile s4-replicated logs --no-color --tail 200
      - name: Stop the replicated brokers and remove test storage
        if: always()
        run: docker compose -p ride-s4-replicated -f spikes/compose.yaml --profile s4-replicated down --volumes

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  container:
    needs: [build, simulator, web, replicated-kafka]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use the compact offline basemap for browser tests
        run: |
          mkdir -p .maps
          cp web/testdata/bengaluru.pmtiles .maps/bengaluru.pmtiles
      - name: Validate default and isolated Compose configuration
        run: node --test scripts/compose-config.test.mjs
      - name: Start PostgreSQL and the app
        run: docker compose up --build --detach
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS localhost:8081/actuator/health/readiness; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Check the roles, the error model and JSON logs
        run: |
          curl -fsS localhost:8081/actuator/info | grep -q '"roles":\["api","realtime","dispatch","worker"\]'
          curl -sS localhost:8080/v1/nothing-here | grep -q '"code":"NOT_FOUND"'
          docker compose logs app | grep -q '"@timestamp"'
      - name: Sign in as the seeded admin, refresh and log out
        run: ./scripts/sign-in-smoke.sh
      - name: Call every admin and profile endpoint as the seeded admin, rider and driver
        run: ./scripts/reference-data-smoke.sh
      - name: Quote a Bengaluru trip as a seeded rider
        run: ./scripts/quote-smoke.sh
      - name: Take a seeded driver online, send a location, find them in a quote and go offline
        run: ./scripts/driver-online-smoke.sh
      - name: Check the live index and the rate limits are in Valkey
        run: |
          docker compose exec -T valkey valkey-cli --scan --pattern '*:drv:*' | grep -q drv
          docker compose exec -T valkey valkey-cli --scan --pattern 'rl:*' | grep -q rl
      - name: Book, cancel and book again as a seeded rider; accept, arrive, start with the PIN and complete as a seeded driver
        run: ./scripts/booking-smoke.sh
      - name: Have a declined fare become dues, pay them, and refund part as operations; read the driver's earnings
        run: ./scripts/payment-smoke.sh
      - name: Rate each other after a ride as a seeded rider and driver, and see the ride's notifications sent
        run: ./scripts/rating-smoke.sh
      - name: Suspend and reinstate a seeded driver, list rides and read a ride's timeline as operations, then cancel it
        run: ./scripts/ops-smoke.sh
      - name: The V1 demo, one ride end to end from quote to receipt, ratings, earnings and timeline
        run: ./scripts/demo.sh
      - name: The web app behind nginx, on the platform's origin
        run: |
          docker compose --profile simulator up --build --detach --no-deps web
          for attempt in $(seq 1 30); do
            if curl -fsS localhost:8088/ | grep -q 'id="root"'; then break; fi
            sleep 2
          done
          curl -fsS localhost:8088/ | grep -q 'id="root"'
          curl -sS localhost:8088/v1/nothing-here | grep -q '"code":"NOT_FOUND"'
      - name: A recorded simulator run without OSRM, ending with a clean invariant check
        id: simulation
        run: docker compose --profile simulator run --build --rm --no-deps simulator
      - name: Collect the simulator report
        if: always() && (steps.simulation.outcome == 'success' || steps.simulation.outcome == 'failure')
        run: docker compose --profile simulator run --rm --no-deps --entrypoint cat simulator state/report.json > simulator-report.json
      - name: Install the browser test runner
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Ride lifecycle, live operations map and mobile layout in the browser
        working-directory: web
        env:
          WEB_BASE_URL: http://127.0.0.1:8088
        run: npm run test:e2e
      - name: Upload simulator and browser reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-15-reports
          path: |
            simulator-report.json
            web/test-results
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes
