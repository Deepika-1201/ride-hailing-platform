name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # v5, not v6: v6 bundles a proprietary caching component under separate terms of use.
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew --no-daemon build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests

  container:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Start PostgreSQL and the app
        run: docker compose up --build --detach
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS localhost:8081/actuator/health/readiness; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Check the roles, the error model and JSON logs
        run: |
          curl -fsS localhost:8081/actuator/info | grep -q '"roles":\["api","realtime","dispatch","worker"\]'
          curl -sS localhost:8080/v1/nothing-here | grep -q '"code":"NOT_FOUND"'
          docker compose logs app | grep -q '"@timestamp"'
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes
