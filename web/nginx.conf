# The web app and the platform on one origin, so the browser needs no CORS (ADR-022).
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /v1/ {
        proxy_pass ${PLATFORM_URL};
        proxy_set_header Host $host;
    }

    location = /ws {
        proxy_pass ${PLATFORM_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Longer than the server's 25 s pings.
        proxy_read_timeout 120s;
    }

    # scripts/setup-maps.sh's output; PMTiles reads it in byte ranges, which nginx serves for static files.
    location /maps/ {
        alias /usr/share/nginx/maps/;
    }
}
