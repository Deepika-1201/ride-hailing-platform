# Throwaway infrastructure for the design spikes (docs/requirements.md §12). Not the product stack.
name: ride-spikes

x-s4-replica: &s4-replica
  image: apache/kafka:4.3.1
  profiles: [s4-replicated]
  labels: &s4-replica-labels
    com.ridehailing.spike: s4
    com.ridehailing.kafka-cluster: s4-replicated
  environment: &s4-replica-environment
    CLUSTER_ID: NqnEdODVKkiLTfJvqd1uqQ
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-r1:9093,2@kafka-r2:9093,3@kafka-r3:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
    KAFKA_MIN_INSYNC_REPLICAS: "2"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
    KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_NUM_NETWORK_THREADS: "2"
    KAFKA_NUM_IO_THREADS: "2"
    KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: "16777216"
    KAFKA_HEAP_OPTS: -Xms128m -Xmx192m
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
    interval: 5s
    timeout: 5s
    retries: 24
  mem_limit: 768m

services:
  valkey:
    image: valkey/valkey:9
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    mem_limit: 512m

  postgis:
    image: imresamu/postgis:18-3.6
    environment:
      POSTGRES_USER: spike
      POSTGRES_PASSWORD: spike
      POSTGRES_DB: spike
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_wal_size=4GB",
              "-c", "max_connections=200", "-c", "shared_preload_libraries=pg_stat_statements"]
    shm_size: 256m
    mem_limit: 1536m

  kafka:
    image: apache/kafka:4.3.1
    profiles: [s4]
    labels:
      com.ridehailing.spike: s4
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    ports:
      - "127.0.0.1:29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  kafka-r1:
    <<: *s4-replica
    labels:
      <<: *s4-replica-labels
      com.ridehailing.kafka-node: "1"
    environment:
      <<: *s4-replica-environment
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:39092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-r1:9092,EXTERNAL://localhost:39092
    ports:
      - "127.0.0.1:39092:39092"

  kafka-r2:
    <<: *s4-replica
    labels:
      <<: *s4-replica-labels
      com.ridehailing.kafka-node: "2"
    environment:
      <<: *s4-replica-environment
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:39093,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-r2:9092,EXTERNAL://localhost:39093
    ports:
      - "127.0.0.1:39093:39093"

  kafka-r3:
    <<: *s4-replica
    labels:
      <<: *s4-replica-labels
      com.ridehailing.kafka-node: "3"
    environment:
      <<: *s4-replica-environment
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:39094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-r3:9092,EXTERNAL://localhost:39094
    ports:
      - "127.0.0.1:39094:39094"

  bench:
    build: ./bench
    profiles: [tools]
    mem_limit: 1g
    ulimits:
      nofile: 65536

  ws-servlet:
    build: ./ws-server
    profiles: [ws]
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: servlet
    mem_limit: 1536m
    ulimits:
      nofile: 65536

  ws-servlet-tuned:
    build: ./ws-server
    profiles: [ws]
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: servlet
      SPIKE_TUNED: "true"
      JAVA_TOOL_OPTIONS: -Dorg.apache.tomcat.websocket.DEFAULT_BUFFER_SIZE=1024
    mem_limit: 1536m
    ulimits:
      nofile: 65536

  ws-reactive:
    build: ./ws-server
    profiles: [ws]
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: reactive
    mem_limit: 1536m
    ulimits:
      nofile: 65536
