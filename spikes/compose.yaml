# Throwaway infrastructure for the design spikes (docs/requirements.md §12). Not the product stack.
name: ride-spikes

services:
  valkey:
    image: valkey/valkey:9
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    mem_limit: 512m

  postgis:
    image: imresamu/postgis:18-3.6
    environment:
      POSTGRES_USER: spike
      POSTGRES_PASSWORD: spike
      POSTGRES_DB: spike
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_wal_size=4GB",
              "-c", "max_connections=200", "-c", "shared_preload_libraries=pg_stat_statements"]
    shm_size: 256m
    mem_limit: 1536m

  kafka:
    image: apache/kafka:4.3.1
    profiles: [s4]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    ports:
      - "127.0.0.1:29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  bench:
    build: ./bench
    profiles: [tools]
    mem_limit: 1g
    ulimits:
      nofile: 65536

  ws-servlet:
    build: ./ws-server
    profiles: [ws]
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: servlet
    mem_limit: 1536m
    ulimits:
      nofile: 65536

  ws-servlet-tuned:
    build: ./ws-server
    profiles: [ws]
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: servlet
      SPIKE_TUNED: "true"
      JAVA_TOOL_OPTIONS: -Dorg.apache.tomcat.websocket.DEFAULT_BUFFER_SIZE=1024
    mem_limit: 1536m
    ulimits:
      nofile: 65536

  ws-reactive:
    build: ./ws-server
    profiles: [ws]
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: reactive
    mem_limit: 1536m
    ulimits:
      nofile: 65536
