# minutes at Chinnaswamy Stadium.
name: stadium-exit
seed: 42
city: blr
duration: 45m
drivers:
  count: 2000
  shift: {start_spread: 10m}
  acceptance: {base: 0.85, per_km_penalty: 0.08}
  response_time: {median: 4s, p95: 11s}
