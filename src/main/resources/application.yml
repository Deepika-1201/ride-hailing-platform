spring:
  application:
    name: ride-hailing-platform
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/ridehailing}
    username: ${DB_USER:ridehailing}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
      validation-timeout: 1000
      # LLD §1.4: every statement, jobs included; longer only with SET LOCAL.
      connection-init-sql: SET statement_timeout = '2s'
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

ride:
  roles: ${RIDE_ROLES:api,realtime,dispatch,worker}
  # HLD §14, LLD §5.8.
  rate-limits:
    otp-per-phone: {capacity: 5, period: 1h}
    otp-per-ip: {capacity: 20, period: 1h}
    quotes-per-rider: {capacity: 30, period: 1m}
    location-per-driver: {capacity: 1, period: 1s}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db

logging:
  pattern:
    level: "%5p [%X{request_id:-}]"
