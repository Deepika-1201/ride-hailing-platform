# Developer machine only.
logging:
  level:
    com.ridehailing: DEBUG

ride:
  seed:
    enabled: true
  security:
    otp:
      # Allowed only in the local and test profiles (LLD §12.1).
      fixed-code: "123456"
  rate-limits:
    # Every local client signs in from one address: the demo and the smoke scripts ask for over 20 codes, and a first
    # simulator run for 2,501 (LLD §18).
    otp-per-ip: {capacity: 5000, period: 1h}
