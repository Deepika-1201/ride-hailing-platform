# Local development only: the credentials below are not secrets. Later versions add their services (LLD §1.5).
name: ride-hailing-platform

services:
  postgres:
    build: docker/postgres
    image: ride-hailing/postgres-postgis:18
    environment:
      POSTGRES_DB: ridehailing
      POSTGRES_USER: ridehailing
      POSTGRES_PASSWORD: ridehailing
    ports:
      - "5434:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridehailing -d ridehailing"]
      interval: 5s
      timeout: 3s
      retries: 20

  # V2 (LLD §1.5): the live index, rate limits and WebSocket tickets; host port 6380 beside the siblings' 6379.
  valkey:
    image: valkey/valkey:8
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/ridehailing
      DB_USER: ridehailing
      DB_PASSWORD: ridehailing
      RIDE_ROLES: api,realtime,dispatch,worker
      RIDE_LOCATION_STORE: valkey
      RIDE_VALKEY_URI: redis://valkey:6379
      RIDE_KAFKA_ENABLED: "${RIDE_KAFKA_ENABLED:-false}"
      RIDE_KAFKA_BROKERS: kafka:9092
      RIDE_KAFKA_MANAGE_TOPICS: "${RIDE_KAFKA_MANAGE_TOPICS:-false}"
      RIDE_ROUTING_OSRM_ENABLED: "${RIDE_ROUTING_OSRM_ENABLED:-false}"
      RIDE_ROUTING_OSRM_BASE_URL: http://osrm:5000
      RIDE_ROUTING_OSRM_CITIES: "${RIDE_ROUTING_OSRM_CITIES:-}"
    ports:
      - "8080:8080"
      - "8081:8081"

  kafka:
    profiles: [kafka]
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: "16777216"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    ports:
      - "127.0.0.1:${KAFKA_PORT:-19092}:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  # V2, the simulator profile (LLD §18): one simulator run against app, and the demo web app on
  # http://localhost:8088. SCENARIO picks the scenario file; reports and cached sign-ins stay in sim-state.
  simulator:
    profiles: [simulator]
    build: simulator
    depends_on:
      app:
        condition: service_started
    command: [run, -api, "http://app:8080", -ws, "ws://app:8080/ws", -scenario, "scenarios/${SCENARIO:-ci}.yaml",
              -routes, testdata/routes/ci.json, -tokens, state/tokens.json, -report, state/report.json]
    volumes:
      - sim-state:/sim/state

  web:
    profiles: [simulator]
    build: web
    depends_on:
      app:
        condition: service_started
    ports:
      - "8088:80"
    volumes:
      - ./.maps:/usr/share/nginx/maps:ro

  # The routing profile (ADR-013): OSRM on the data scripts/setup-maps.sh builds.
  osrm:
    profiles: [routing]
    image: ghcr.io/project-osrm/osrm-backend@sha256:55dbfd47d984c2cacd64e32901b4321c86b5ec761438e69aa053dc78698a786f
    command: [osrm-routed, --algorithm, mld, /data/bengaluru.osrm]
    volumes:
      - ./.maps:/data:ro
    ports:
      - "5000:5000"

volumes:
  postgres-data:
  sim-state:
  kafka-data:
